# Include in the cabinet's existing HTTPS virtual host (or its trusted TLS upstream).
location = /tiktokhelper {
    absolute_redirect off;
    return 308 /tiktokhelper/;
}

location ^~ /tiktokhelper/ {
    # Trailing slash strips the public mount prefix for both HTTP and WebSockets.
    proxy_pass http://tiktok_helper_app/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-TikTok-Local-Access '';
    proxy_set_header Authorization '';
    proxy_set_header Cookie $tiktok_helper_cookie_header;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $tiktok_helper_upgrade_connection;
    proxy_read_timeout 75s;
    proxy_redirect off;
    proxy_cache off;
    client_max_body_size 11m;
    access_log off;
}

location = /api/integrations/tiktokhelper/authorize {
    proxy_pass http://vline_cabinet_bff;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    proxy_cache off;
    access_log off;
}

# Token exchange and session introspection use the private BFF connection.
location ^~ /api/integrations/tiktokhelper/ {
    return 404;
}
