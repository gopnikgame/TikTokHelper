# Include in http {}. The upstreams are defined by the host's nginx configuration.
map $http_upgrade $tiktok_helper_upgrade_connection {
    default upgrade;
    '' close;
}

map $http_cookie $tiktok_helper_session_cookie {
    default '';
    "~(?:^|;[[:space:]]*)tiktok_helper_session=[^;]*(?:;[^;]*)*;[[:space:]]*tiktok_helper_session=" '';
    "~(?:^|;[[:space:]]*)tiktok_helper_session=(?<helper_session>[A-Za-z0-9_-]{43})(?:;|$)" "tiktok_helper_session=$helper_session";
}

map $http_cookie $tiktok_helper_login_cookie {
    default '';
    "~(?:^|;[[:space:]]*)__Host-tiktok_helper_browser=[^;]*(?:;[^;]*)*;[[:space:]]*__Host-tiktok_helper_browser=" '';
    "~(?:^|;[[:space:]]*)__Host-tiktok_helper_browser=(?<helper_login>[A-Za-z0-9_-]{43})(?:;|$)" "__Host-tiktok_helper_browser=$helper_login";
}

map "$tiktok_helper_session_cookie|$tiktok_helper_login_cookie" $tiktok_helper_cookie_header {
    default '';
    "~^[^|]+[|][^|]+$" "$tiktok_helper_session_cookie; $tiktok_helper_login_cookie";
    "~^[^|]+[|]$" $tiktok_helper_session_cookie;
    "~^[|][^|]+$" $tiktok_helper_login_cookie;
}
