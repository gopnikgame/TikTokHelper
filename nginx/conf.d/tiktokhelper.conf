server {
    listen 80;
    server_name monitoring.tik-talk.ru;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name monitoring.tik-talk.ru;
    
    ssl_certificate /etc/letsencrypt/live/monitoring.tik-talk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.tik-talk.ru/privkey.pem;
    
    location / {
        proxy_pass http://webapp:80;  # Здесь изменить tiktokhelper на webapp
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WebSocket поддержка
    location /socket.io/ {
        proxy_pass http://nodejs:3000;  # Здесь изменить tiktokhelper на nodejs
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

