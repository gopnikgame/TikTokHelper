<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0f" />
    <title>Нет связи — TikTokHelper</title>
    <style>
      :root { color: #f5f7f8; background: #090b0f; font-family: "Segoe UI Variable", "Trebuchet MS", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1rem; background: radial-gradient(circle at 80% -10%, #26303b 0, transparent 28rem), #090b0f; }
      main { width: min(34rem, 100%); padding: clamp(1.4rem, 5vw, 3rem); border: 1px solid #29313c; border-left: 4px solid #ff356b; background: #12161df7; }
      small { color: #ff356b; font-family: Consolas, monospace; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: .5rem 0 1rem; font-family: Impact, "Arial Narrow", sans-serif; font-size: clamp(2.6rem, 12vw, 4.8rem); font-weight: 500; line-height: .9; text-transform: uppercase; }
      p { color: #9ca5af; font-size: 1.05rem; line-height: 1.5; }
      button { min-height: 2.75rem; border: 0; border-radius: .55rem; padding: .75rem 1rem; color: #180810; background: #ff356b; font: inherit; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 3px solid #25e6d4; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <small>TikTokHelper</small>
      <h1>Нет связи с сервером</h1>
      <p>Для входа, чата и управления эфиром нужен интернет. Проверьте соединение и попробуйте снова — настройки на сервере не пропадут.</p>
      <button type="button" onclick="window.location.reload()">Повторить</button>
    </main>
  </body>
</html>
